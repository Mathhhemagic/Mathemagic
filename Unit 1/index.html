.stars span.filled{

.stars span.pop{

@keyframes pop{

<script>

const firebaseConfig = {

};


firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

auth.onAuthStateChanged(async (user) => {
    if (!user) return;

    const doc = await db.collection("users").doc(user.uid).get();
    if (!doc.exists) return;

    const data = doc.data();
    const accuracy = data.activity_1?.accuracy || 0;

    updateStars(accuracy);
});



function updateStars(accuracy){

    let stars = "☆ ☆ ☆";
    const starselement = document.querySelectorAll("#activity1-stars span");

    let filledCount = 0;

    if(accuracy === 100){
        filledCount = 3;
    }

    else if (accuracy >= 70){
        filledCount = 2;
    }

    else if (accuracy >= 40){
        filledCount = 1;
    }
    
    starselement.forEach(star => {
        star.textContent = "☆";
        star.classList.remove("filled", "pop");
    });

    for (let i = 0; i < filledCount; i++){
        setTimeout(() => {
            starselement[i].textContent = "★";
            starselement[i].classList.add("filled, pop");
        }, i * 300);
    }

}

firebase.auth().onAuthStateChanged(async user => {
    const colors = ["#ffb5b0", "#ffd6b0", "#f8ffb0", "#ccffb0", "#b0ffd8", "#b0ffd8", "#b0f8ff", "#b0deff", "#b0deff", "#bbb0ff", "#c5b0ff", "#e6b0ff", "#f5b8ec", "#eba9b7"]
    const icon = document.getElementById("user-icon");
    const dropdown = icon.nextElementSibling;
    if (user){
    const uid = user.uid
    icon.textContent = user.displayName ? user.displayName[0].toUpperCase(): "U";
    let hash = 0;
    const str = user.uid || user.email;
    for (let i=0; i<str.length; i++) hash += str.charCodeAt(i);
    const colorIndex = hash % colors.length;
    icon.style.backgroundColor = colors[colorIndex];
    dropdown.innerHTML = 
    `<a href = "/profile/">Profile</a>
    <a href = "/login/" id = "logout">Logout</a>`;
     const logout = document.getElementById("logout");
    logout.addEventListener("click", async (e) => {
        e.preventDefault();
        try{
            await firebase.auth().signOut();
            window.location.href = "/login/";
        }
        catch(error){
            console.error("Logout error:", error);
            alert("Failed to logout: " + error.message);
        }
    })

    }
    else{
        icon.textContent = "";
        icon.style.backgroundColor = "gray";
        dropdown.innerHTML = 
        `<a href = "/login/">Login</a>
        <a href = "/signup/">Signup</a>
        `
    }
    
    });

</script>
