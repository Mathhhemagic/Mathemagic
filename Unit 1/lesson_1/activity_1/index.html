     cursor: pointer;
                font-family: "Libertinus Math", system-ui;

}




.hint-explanation{
                font-size: 2em;
                font-family: "Libertinus Math", system-ui;
                color:#333535;
                opacity: 0;
                transition: 0.5s ease;
                align-content: center;

                overflow: hidden;

                transform: translateY(-10px);
                transition: height 0.9s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.9s ease, transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);

           }

           .hint-explanation.visible{
                height: auto;
                opacity: 1;
           }

           .answer-explanation.visible{
            max-height: none;
            overflow: visible;
            opacity: 1;
            transform: translateY(0);
            white-space: pre-line; 
            }
            .answer-explanation p.step{
                background: #ffffff;
                padding: 0.8em 1em;
                border-left: 10px solid #6e88cf;
                margin: 0.5em 0;
                border-radius: 5px;
                font-size: 1.5rem;
                border-top: 1px solid black;
                border-right: 1px solid black;
                border-bottom: 1px solid black;
                white-space: pre-line; 
            }

            .answer-explanation{
                justify-content: center;
                max-width: 800px;
                width: 90%;
                max-height: 0;
                overflow:hidden;
                margin: 0 auto;
                position: relative;
                font-size: 1.75rem;
                font-family: "Libertinus Math", system-ui;
                transform: translateY(-10px);
                transition: max-height 0.9s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.9s ease, transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
                opacity: 0;
                color:#333535;
                text-align: center;
                padding: 0;
                min-width: 1rem;
                margin-bottom: 1.5%;
                align-items: center;
                white-space: pre-line; 
                

            }

            .hint button:disabled{
                cursor: not-allowed;
                background-color: rgba(178, 190, 181, 0.5);
                box-shadow: 0 0 30px rgba(75, 75, 75, 0.5);
                border-color: grey;
                pointer-events: none;
           }

            margin-top: -4%;
           }

           .end-card{
            display: none;
             background: #ffffff;
                padding: 0.8em 1em;
                border-left: 10px solid #6e88cf;
                margin: 0.5em 0;

                font-size: 1.5rem;
                border-top: 1px solid black;
                border-right: 1px solid black;
                border-bottom: 1px solid black;
                white-space: pre-line; 

            }

<script>

const firebaseConfig = {

  apiKey: "AIzaSyDRjjvLABEFL-PgbChUFNZW6u38U6c7jP4",

  authDomain: "mathemagic-fcb1d.firebaseapp.com",

};


firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const questions = 
[
{
    question: "Solve for x:\n10x + 4 = 44",
    correct: "4",
    hint: "Start off by subtracting by 4 on both sidesS",
    steps: [
    "Subtract by 4 on both sides:\n10x = 40",
    "Divide by 10 on both sides:\nx = 4"
    ],
    img_question: ""
},
{
    question: "2(x + 3) = 56",
    correct: "25",
    hint: "Start by distributing the coefficient 2 to each of the terms",
    steps: [
    "Distribute the coefficient 2 to each of the terms:\n2x + 6 = 56",
    "Subtract by 6 on both sides:\n2x = 50",
    "Divide by 2 on both sides:\nx = 25"
    ],
    img_question: ""
},
{
    question: "4(5x + 5) = 120",
    correct: "5",
    hint: "Start by distributing the coefficient 4 to each of the terms",
    steps: [
    "Distribute the coefficient 4 to each of the terms:\n4 * 5x + 4 * 5 = 120\n20x + 20 = 120",
    "Subtract by 20 on both sides:\n20x = 100",
    "Divide by 20 on both sides:\nx = 5"
    ],
    img_question: ""
},
{
    question: "24x + 23 = 2x + 45",
    correct: "1",
    hint: "Start by combining like terms (Constants on one side, variables on the other side)",
    steps: [
    "Subtract by 23 on both sides:\n24x = 2x + 22",
    "Subtract by 2x on both sides:\n22x = 22",
    "Divide by 1 on both sides:\nx = 1"
    ],
    img_question: ""
},
{
    question: "3(x + 10) = 4x",
    correct: "10",
    hint: "Start by distributing the coefficient 3 to each of the terms",
    steps: [
    "Start by distributing the coefficient 3 to each of the terms:\n3x + 30 = 4x",
    "Subtract by 3x on both sides:\n30 = 3x",
    "Divide by 3 on both sides:\nx = 10"
    ],
    img_question: ""
},
{
    question: "10x + 10 = 2x + 98",
    correct: "11",
    hint: "Start by combining like terms (Constants on one side, variables on the other side)",
    steps: [
    "Start by combining like terms (Constants on one side, variables on the other side):\n8x = 88",
    "Divide by 8 on both sides:\nx = 11",
    "Divide by 3 on both sides\n:x = 10"
    ],
    img_question: ""
},
{
    question: "10x + 15 = 110x (As a decimal)",
    correct: "0.15",
    hint: "Start by subtracting by 10x on both sides",
    steps: [
    "Start by subtracting by 10x on both sides:\n15 = 100x",
    "Divide by 100 on both sides:\nx = 15/100, 0.15, or 3/20",
    ],
    img_question: ""
},
{
    question: "10(x + 4) = 24x + 12",
    correct: "2",
    hint: "Start by distributing the coefficient 10 to each of the terms",
    steps: [
    "Start by distributing the coefficient 10 to each of the terms:\n10x + 40 = 24x + 12",
    "Combine like terms (Constant on one side, variables on the other side):\n28 = 14x",
    "Divide by 14 on both sides:\nx = 2"
    ],
    img_question: ""
},
{
    question: "100x + 25 = 75",
    correct: "0.5",
    hint: "Start by subtracting by 25 on both sides",
    steps: [
    "Subtract by 25 on both sides:\n100x = 50",
    "Divide by 100 on both sides:\nx = 0.5, 50/100, ½",
    ],
    img_question: ""
},
{
    question: "22x + 82 = 20x + 120",
    correct: "19",
    hint: "Start by combining like terms (Constants on one side, variables on the other side)",
    steps: [
    "Combine like terms (Constants on one side, variables on the other side):\n2x = 38",
    "Divide by 2 on both sides:\nx = 19",
    ],
    img_question: ""
}
];

const question = document.getElementById("question");
const answerInput = document.getElementById("answer-input");
const submitButton = document.getElementById("submit-answer");
const hintButton = document.getElementById("hint");
const hintExplanation = document.querySelector(".hint-explanation");
const steps = document.querySelector(".answer-explanation")
let correctAnswers = 0;
let wrongAnswers = 0;
let totalQuestions = questions.length;
document.getElementById("form").addEventListener("submit", function(e){
    e.preventDefault();
    handleAnswer();
})


submitButton.addEventListener("click", handleAnswer)

let currentIndex = 0;
let hintShown = false;
let points = 0;

function loadQuestion(){
    hintShown = false;
    const q = questions[currentIndex];
    question.innerText = q.question;
    hintExplanation.innerText = "";
    hintExplanation.classList.remove("visible");
    steps.innerHTML = "";
    answerInput.value = "";
    answerInput.disabled = false;
    submitButton.disabled = false;
    answerInput.style.borderColor = "white";
    updateHintButton();
}

function updateHintButton(){
    hintButton.disabled = hintShown;
    hintButton.style.opacity = hintShown ? 0.5 : 1;
}

function showSteps(q){
    steps.innerHTML = "";
    q.steps.forEach((step, i) =>{
        const p = document.createElement("p");
        p.classList.add("step");
        p.innerHTML = `<strong>Step ${i+1}:</strong> ${step}`;
        steps.appendChild(p);
    });
    steps.classList.add("visible")
}

function nextQuestion(){
    if(currentIndex < questions.length - 1){
        currentIndex++;
        loadQuestion();
        answerInput.style.backgroundColor = "white";

    }
    else{
        showEndCard();
    }
}
let awaitingNext = false;
const err = document.getElementById("error")
    answerInput.addEventListener("input", () => {
        err.innerText = "";
    });
function handleAnswer(){
    if (awaitingNext){
        hintButton.disabled = true;
        nextQuestion();
        submitButton.innerText = "Check"
        submitButton.style.borderColor = "rgb(2, 126, 0)";
        submitButton.classList.remove("next");

        awaitingNext = false;
        return;
        }


    
    const q = questions[currentIndex];
    const userAnswer = answerInput.value.trim();
    if (userAnswer === ""){
        err.innerText = "Please enter an answer!"
                return;
    }

    answerInput.disabled = true;
    if(userAnswer === q.correct){
        points += 10;
        correctAnswers++;
        document.getElementById("points").innerText = points;
        answerInput.style.borderColor = "rgb(48, 133, 24, 0.3)";
    }
    else{
        wrongAnswers++;
        answerInput.style.borderColor = "rgb(135, 24, 24, 0.3)";
        const correct = document.createElement("p");
        correct.innerText = `Correct answer: ${q.correct}`;
        correct.style.color = "green";
        steps.appendChild(correct);
    }

    showSteps(q);
    hintButton.disabled = true;

    const user = auth.currentUser;
    if(user){
        const quizRef = db.collection("users").doc(user.uid).collection("activity_1").doc("progress");
        quizRef.set({
            currentIndex,
            userAnswer,
            points
        }, {merge:true});
    }
    submitButton.innerText = "Next";
    submitButton.style.borderColor = "rgb(110, 136, 207)";
    submitButton.classList.add("next");
    awaitingNext = true;

};
hintButton.addEventListener("click", () => {
if(hintShown) return;
const q = questions[currentIndex];
hintExplanation.innerText = q.hint;
hintExplanation.classList.add("visible");
hintShown = true;
updateHintButton();

});

function showEndCard(){
    document.getElementById("points").style.display = "none";
    document.querySelector(".question_container").style.display = "none";
    document.querySelector(".login-container").style.display = "none";
    document.querySelector(".check").style.display = "none";
    document.querySelector(".hint").style.display = "none";
    document.querySelector(".hint-explanation").style.display = "none";
    document.querySelector(".answer-explanation").style.display = "none";
    const accuracy = Math.round((correctAnswers / totalQuestions) * 100);

    document.getElementById("final-points").innerText = `Xp: ${points}`
    document.getElementById("final-correct").innerText = `Correct: ${correctAnswers}`;
    document.getElementById("final-wrong").innerText = `Wrong: ${wrongAnswers}`;
    document.getElementById("final-accuracy").innerText = `Accuracy: ${accuracy}%`;
    document.getElementById("end-card").style.display = "block";

    
}

loadQuestion();
</script>
