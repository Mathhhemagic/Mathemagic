const questions =

    ],

{

    steps: [

const question = document.getElementById("question");
const answerInput = document.getElementById("answer-input");
const submitButton = document.getElementById("submit-answer");
const hintButton = document.getElementById("hint");
const hintExplanation = document.querySelector(".hint-explanation");
const steps = document.querySelector(".answer-explanation")
let correctAnswers = 0;
let wrongAnswers = 0;
let totalQuestions = questions.length;
document.getElementById("form").addEventListener("submit", function(e){
    e.preventDefault();
    handleAnswer();
})


submitButton.addEventListener("click", handleAnswer)

let currentIndex = 0;
let hintShown = false;
let points = 0;

function loadQuestion(){
    hintShown = false;
    const q = questions[currentIndex];
    question.classList.remove("show")
    setTimeout(() => {
        question.innerText = q.question;
        question.classList.add("show");
    }, 200);
    hintExplanation.innerText = "";
    hintExplanation.classList.remove("visible");
    steps.innerHTML = "";
    answerInput.value = "";
    answerInput.disabled = false;
    submitButton.disabled = false;
    answerInput.style.borderColor = "white";
    updateHintButton();
}

function updateHintButton(){
    hintButton.disabled = hintShown;
    hintButton.style.opacity = hintShown ? 0.5 : 1;
}

function showSteps(q){
    steps.innerHTML = "";
    q.steps.forEach((step, i) =>{
        const p = document.createElement("p");
        p.classList.add("step");
        p.innerHTML = `<strong>Step ${i+1}:</strong> ${step}`;
        steps.appendChild(p);
    });
    steps.classList.add("visible")
}

function nextQuestion(){
    if(currentIndex < questions.length - 1){
        currentIndex++;
        loadQuestion();
        answerInput.style.backgroundColor = "white";

    }
    else{
        showEndCard();
    }
}
let awaitingNext = false;
const err = document.getElementById("error")
    answerInput.addEventListener("input", () => {
        err.innerText = "";
    });
function handleAnswer(){
    if (awaitingNext){
        hintButton.disabled = true;
        nextQuestion();
        submitButton.innerText = "Check"
        submitButton.style.borderColor = "rgb(2, 126, 0)";
        submitButton.classList.remove("next");

        awaitingNext = false;
        return;
        }


    
    const q = questions[currentIndex];
    const userAnswer = answerInput.value.trim();
    if (userAnswer === ""){
        err.innerText = "Please enter an answer!"
                return;
    }

    answerInput.disabled = true;
    if(parseFloat(userAnswer) === parseFloat(q.correct)){
        answerInput.classList.add("correct");
        setTimeout(() => answerInput.classList.remove("correct"), 400);
        points += 10;
        correctAnswers++;

        const battery = document.querySelector(".battery");
battery.classList.add("pop");
setTimeout(() => battery.classList.remove("pop"), 300);
        const fill = document.getElementById("battery-fill")
        fill.classList.add("grow");
        setTimeout(() => fill.classList.remove("grow"), 500);
        const maxXP = questions.length * 10;
        const percent = (points /maxXP) * 100
        fill.style.width = percent + "%";
        document.getElementById("battery-text").innerText = Math.round(percent) + "%"

        document.getElementById("battery-fill").style.width = percent + "%";

        
        if (percent < 40){
            fill.style.background = "linear-gradient(90deg, #36b5ff, #6fd6ff)";
        }
        else if (percent < 70){
         fill.style.background = "linear-gradient(90deg, #6fff8b, #b4ffcc)";
        }
        else if (percent < 100){
        fill.style.background = "linear-gradient(90deg, #ffd86f, #ffb347)";
        }
        else{
            fill.style.background = "linear-gradient(90deg, #ff9a3c, #ff5e00)";
        }
      
        
        answerInput.style.borderColor = "rgb(48, 133, 24, 0.3)";
    }
    else{
        answerInput.classList.add("wrong");
        setTimeout(() => answerInput.classList.remove("wrong"), 400);
        wrongAnswers++;
        answerInput.style.borderColor = "rgb(135, 24, 24, 0.3)";
        const correct = document.createElement("p");
        correct.innerText = `Correct answer: ${q.correct}`;
        correct.style.color = "green";
        steps.appendChild(correct);
    }

    showSteps(q);
    hintButton.disabled = true;

  
    submitButton.innerText = "Next";
    submitButton.style.borderColor = "rgb(110, 136, 207)";
    submitButton.classList.add("next");
    awaitingNext = true;

};
hintButton.addEventListener("click", () => {
if(hintShown) return;
const q = questions[currentIndex];
hintExplanation.innerText = q.hint;
hintExplanation.classList.add("visible");
hintShown = true;
updateHintButton();

});

function showEndCard(){
    document.querySelector(".question_container").style.display = "none";
    document.querySelector(".login-container").style.display = "none";
    document.querySelector(".check").style.display = "none";
    document.querySelector(".hint").style.display = "none";
    document.querySelector(".hint-explanation").style.display = "none";
    document.querySelector(".answer-explanation").style.display = "none";
    const accuracy = Math.round((correctAnswers / totalQuestions) * 100);
 document.querySelector(".all-cards").style.display = "flex";
  document.querySelector(".mascot img").style.display = "flex";

    document.getElementById("accuracy-value").innerText = accuracy + "%";
document.getElementById("xp-value").innerText = points;
  const user = auth.currentUser;
    if(user){
        const userRef = db.collection("users").doc(user.uid);
        userRef.set({
           activity_1: {
            accuracy: accuracy
           }
        }, {merge: true});
    }
if (accuracy === 100){
        document.getElementById("word").innerText = "Perfect!"

}

else if (accuracy < 100 && accuracy >= 70){
    document.getElementById("word").innerText = "Amazing!"
}

else if (accuracy < 70 && accuracy >= 50){
    document.getElementById("word").innerText = "Not bad!"
}

else if (accuracy < 50 && accuracy >= 20){
    document.getElementById("word").innerText = "Not bad!"
}

else{
        document.getElementById("word").innerText = "Try again!"

}
    
    
}

loadQuestion();
