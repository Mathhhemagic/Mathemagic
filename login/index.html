<style>


.login-container{

     .math-container{

        pointer-events: none;

    @keyframes floatUp{

form{

form input:hover{

}

form input:focus{

 text-decoration: none;

<script defer>
    const form = document.getElementById('form')
    const email_input = document.getElementById('email-input')
    const password_input = document.getElementById('password-input')
    const error_message = document.getElementById("error-message")


    function getLoginErrors(email,password){
    let errors = []
    if(email === '' || email === null){
        errors.push("Email is required")
        email_input.parentElement.classList.add("incorrect")
    }
    if(password === '' || password === null){
        errors.push("Password is required")
        password_input.parentElement.classList.add("incorrect") 
    }
    return errors
}
    form.addEventListener('submit', async(e) =>{
        e.preventDefault()
        const errors = getLoginErrors(email_input.value, password_input.value);
        if (errors.length > 0){
            error_message.innerText = errors.join(". ")
            return;
        

    }
    try {
        await firebase.auth().signInWithEmailAndPassword(email_input.value, password_input.value);
        window.location.href = "index.html"
    }
    catch(error){
        error_message.innerText = "Invalid email or password";

        if(error.code === "auth/invalid-login-credentials"){
            email_input.parentElement.classList.add("incorrect");
            password_input.parentElement.classList.add("incorrect");
        }

        if(error.code === "auth/user-not-found"){
            email_input.parentElement.classList.add("incorrect");
        }

        if(error.code === "auth/wrong-password"){
            password_input.parentElement.classList.add("incorrect");
        }
        if(error.code === "auth/invalid-email"){
            email_input.parentElement.classList.add("incorrect");
        }
    }


    });



[email_input, password_input].forEach(input => {
    input.addEventListener("input", () => {
        if(input.parentElement.classList.contains("incorrect")){
            input.parentElement.classList.remove("incorrect");
            error_message.innerText = "";
        }
    });
});
