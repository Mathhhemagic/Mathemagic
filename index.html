        background-size: 400% 400%;
        text-decoration: none;
        color: transparent;
        animation: gradient 5s linear infinite;
    }


    @keyframes gradient{
        0%{
            background-position: 0% 50%;
        }


        50%{
            background-position: 100% 50%;
        }


        100%{
            background-position: 0% 50%;
        }

.mathemagic-logo{
width: 100%;
text-align: center;
padding: 4% 0%;
}
.mathemagic-logo img{
    height: 10em;
    width: 10em;
    display: block;
    margin: 0 auto;
    padding-top: 1%;
    visibility: visible;


}
.mathemagic-logo img{
    transition: transform 0.3s ease;
}
.mathemagic-logo img:hover{
    transform: translateY(-15px)
}


.anim{
            opacity: 0;
            transform: translateY(30px);
            animation: moveUp 0.5s linear forwards
        }
        @keyframes moveUp{
            to{
                opacity: 1;
                transform: translateY(0px);
            }
        }
   
    .math-container{
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
    }


    .math-float{
        position: absolute;
        bottom: -2rem;
        font-size: 3rem;
        font-family: "Zilla Slab", serif;
        animation: floatUp linear forwards;
        color:rgb(21, 41, 47)
    }


    @keyframes floatUp{
        from{
            transform: translateY(0);
            opacity: 0.2;
        }
        to{
            transform: translateY(-110vh);
            opacity:0;
        }
    }

    const shape = document.createElement("div");

    shape.style.fontSize = (2 + Math.random() *2) + "rem";
