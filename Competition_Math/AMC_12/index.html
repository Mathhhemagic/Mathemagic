    reset.setHours(resetHour, resetMinute, 0, 0);

    if (now < reset){
        reset.setDate(reset.getDate()-1);

    }

    return reset;
}

    if(!sessionStorage.getItem("loginPopupShown"))
   {
        popupOverlay.style.display = "flex";
        sessionStorage.setItem("loginPopupShown", "true");
    }
}
closePopupButton.addEventListener("click", () => {
    popupOverlay.style.display = "none";
})
if (q.img_question){
    img.src = q.img_question;
    imgWrapper.style.display = "block";
}
else{
    img.removeAttribute("src");
    imgWrapper.style.display = "none";
}
const correctAnswer = q.correct;

auth.onAuthStateChanged(async user => {
    document.body.style.visibility = "visible";
  if (!user) {
    console.log("Guest user - progress not saved");
    showLoginPopup();
    return;
  }



const userRef = db.collection("users").doc(user.uid);
const userDoc = await userRef.get();
if (!userDoc.exists){
    await userRef.set({
        email: user.email,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
}
const dayRef = db.collection("users").doc(user.uid).collection("AMC_12").doc(dayKey);
const dayDoc = await dayRef.get();

if (dayDoc.exists){
    const data = dayDoc.data();
    time = data.remainingTime ?? q.minutes * 60;
    paused = data.paused ?? false;
    updateCountdown();
    if (!paused) startTimer();
    loadUserData(user.uid);
}
else
{
    time = q.minutes * 60;
    paused = false;
    await dayRef.set({remainingTime: time, paused: false, hintsUsed: false, points: 0});
    updateCountdown(0);
    startTimer(0);

}
});
    








async function loadUserData(uid){
    const doc = await db
    .collection("users")
    .doc(uid)
    .collection("AMC_12")
    .doc(dayKey)
    .get();

    if (doc.exists){
        const data = doc.data();
        hintsUsed = data.hintsUsed;
        hintClicked = data.hintClicked || false;
        points = data.points || 0;

        if (data.answer){
          answerSubmitted = true;
    reload(data.answer);
}

    }
    updateHintButton();
}

function updateHintButton(){
    if(hintsUsed || answerSubmitted){
        hintButton.disabled = true;
        hintExplanation.classList.add("disabled-after-answer");

        hintButton.style.backgroundColor = "rgb(178, 190, 181, 0.5)";
        hintButton.style.boxShadow = "0 0 30px rgb(75, 75, 75, 0.5)";
        hintButton.style.borderColor = "grey";

    if (hintClicked){
        hintExplanation.classList.add("visible");
        hintExplanation.style.height = hintExplanation.scrollHeight + "px";
        hintExplanation.style.opacity = "1";
        hintExplanation.style.transform = "translateY(0)"
    }
        
        

    
    else{
        hintExplanation.classList.remove("visible")
        hintExplanation.style.height = "0px";
        hintExplanation.style.opacity = "0";
        hintExplanation.style.transform = "translateY(-10px)";

    }
}
    else{
    hintButton.disabled = false;
    hintButton.classList.remove("disabled-after-answer");

    hintButton.style.backgroundColor = "#f7f7f7";
    hintButton.style.boxShadow = "0 0 40px grey";
    hintButton.style.borderColor = "rgb(255,166,56)";

    hintExplanation.classList.remove("visible");
    hintExplanation.style.height = "0px";
    hintExplanation.style.opacity = "0";
    hintExplanation.style.transform = "translateY(-10px)"
    }
}
hintButton.addEventListener("click", async () => {
    if (hintsUsed) return;
    hintsUsed = true;
    hintClicked = true;
    updateHintButton();

    const user = auth.currentUser;
    if (user){
        await db.collection("users").doc(user.uid).collection("AMC_12").doc(dayKey).set({hintsUsed: true,hintClicked: true, points: points}, {merge:true});
    }
});

function showAnswerExplanation(){
    explanation.innerHTML = "";
    q.steps.forEach((step, index) => {
        const stepDiv = document.createElement("p");
        stepDiv.classList.add("step");
        stepDiv.innerHTML = `<strong>Step ${index +1}:</strong><br><br>${step}`;
        explanation.appendChild(stepDiv);
    });
    explanation.classList.add("visible")

}
function reload(choice){
    if (timeInterval){
        clearInterval(timeInterval);
        timeInterval = null;
        timer.style.color = "black";
    }

    hintClicked = hintClicked || false;
    updateHintButton();
    buttons.forEach(button => {
        button.disabled = true;
        button.parentElement.classList.add("disabled");

        
    

        if (button.id === correctAnswer){
            button.style.backgroundColor = "rgb(48, 133, 24, 0.5)";
            button.style.boxShadow = "0 0 30px rgb(75, 75, 75, 0.5)";

        }
        else if (button.id === choice){
            button.style.backgroundColor = "rgb(135, 24, 24, 0.5)";
            button.style.boxShadow = "0 0 30px rgb(135, 24, 24, 0.5)";


        }
        else
        {
            button.style.backgroundColor = "rgb(178, 190, 181, 0.5)";
            button.style.boxShadow = "0 0 30px rgb(75, 75, 75, 0.5)";
        }

    });
    showAnswerExplanation();
}


const startingMinutes = q.minutes;



const answer = document.querySelector(".hint-explanation");
function getLocalDayKey(date = new Date()){
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}

async function awardXP(uid) {
    const userRef = db.collection("users").doc(uid);

    const dayRef = userRef.collection("AMC_12").doc(dayKey);

    const today = getLocalDayKey();

    const yesterdayDate = new Date();

    yesterdayDate.setDate(yesterdayDate.getDate() - 1);
    const yesterday = getLocalDayKey(yesterdayDate);

    await db.runTransaction(async transaction => {
        const userSnap = await transaction.get(userRef);
        const daySnap = await transaction.get(dayRef);

        const userData = userSnap.exists ? userSnap.data() : {};

        const dayData = daySnap.exists ? daySnap.data() : {};

        if (dayData.xpAwarded) return;

        const lastActiveDate = userData.lastActiveDate || null;
        let streak = userData.dailyStreak || 0;

        if (lastActiveDate !== today){
            streak = lastActiveDate === yesterday ? streak + 1 : 1;
        }
           transaction.set(userRef, {
            globalXP: (Number(userData.globalXP) || 0) + 2,
            dailyXP: (lastActiveDate === today ? (Number(userData.dailyXP) || 0) + 2 : 2),
            dailyStreak: streak,
            lastActiveDate: today
        }, {merge: true});

        transaction.set(dayRef, {
            xpAwarded: true},
            {merge: true});
        });
    }







buttons.forEach(button => {
    button.addEventListener( "click", async () => {
        let starsEarned = 0;
        paused = true;
        answerSubmitted = true;
        if (timeInterval){
            clearInterval(timeInterval);
        }
        if (button.id === correctAnswer){
            starsEarned = 1;
                if (!timeUp){
                starsEarned++;
            }

            if (!hintsUsed){
                starsEarned++;
            }
        }
       
        reload(button.id)
    
        const user = auth.currentUser;
        if (user){

            const dayRef = db.collection("users").doc(user.uid).collection("AMC_12").doc(dayKey);
            await db.collection("users").doc(user.uid).collection("AMC_12").doc(dayKey).set({
                answer: button.id,
                stars: starsEarned,
                hintsUsed: hintsUsed,
                hintClicked: hintClicked,
                paused: true,
                remainingTime: time


            }, {merge:true});

            if (button.id === correctAnswer){
                await awardXP(user.uid);
            }
        }
        reload(button.id);
    });
});

window.addEventListener("focus", () => {
    if(!timeUp && !paused) startTimer();
});

function startTimer(){
    if (!timeInterval){
    timeInterval = setInterval(async ()=>{
        updateCountdown();

        const user = auth.currentUser;
        if(user){
            await db.collection("users").doc(user.uid).collection("AMC_12").doc(dayKey).set({
                remainingTime: time, paused: paused,}, {merge:true});
            
            }
        }, 1000);
        }
    }
    


function updateCountdown(){
    if (time<=0){
        timer.innerHTML = "⏱️0:00";
        timer.style.color = "#EB5E5E";
        timeUp = true;
        
        clearInterval(timeInterval);
        timeInterval = null;

    
        return;
    }
    const minutes = Math.floor(time/60);
    const seconds = time % 60;
    timer.innerHTML = `⏱️${minutes}:${seconds.toString().padStart(2, "0")}`;
    time--



}

window.addEventListener("load", () => {
    startTimer();
})




</script>
