<script>
 
const firebaseConfig = {

  apiKey: "AIzaSyDRjjvLABEFL-PgbChUFNZW6u38U6c7jP4",

};


firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const questions = [

{

    question: "In the figure above, l and m are parallel, y = 20, and z = 60. What is the value of x?",
    answer: {A:"100°", B:"90°", C: "20°", D: "80°"},
    correct: "A",
    hint: "Angle y and the missing angle of the triangle made from transversal l are congruent",
    steps: ["Angle y and the missing angle of the triangle made from transversal l are congruent, because lines l and m are parallel and the two angles are corresponding.", "The angles of a triangle add up to 180°, so 180 - 20 - 60 = 100°"],
    minutes: 2,
    img_question: "question1.jpg"

}
,
{
    question:  "If √x = √a + √b, what is x in terms of a and b?",
    answer: {A:"√a + 2√a√b + √b", B:"a + b", C: "a² + b²", D: "a + 2√(ab) + b"},
    correct: "D",
    hint: " (x + y)² = x² +2xy + y²",
    steps: ["Square both sides. Use  (x + y)² = x² +2xy + y²", " x = a + a + 2√(ab) + b"],
    minutes: 2,
    img_question: "question1.jpg"
}
,
{
    question: "What is 8% of 75?",
    answer: {A:"3.5", B:"7.5", C:"6", D:"5"},
    correct: "D",
    hint:"8% of 75 = 75% of 8",
    steps: [" Use the reversible trick. 8% of 75 = 75% of 8."," 75% is just ¾", "¾ of 8 is 6."],
    minutes: 1,
    img_question: ""
}
,
{
    question: "What is the value of x in the equation 4² + 4² + 4² + 4² = 2ˣ?",
    answer: {A:8, B:6, C:10, D:4},
    correct: "B",
    hint: "First, add the 4²’s together, and then make it into a base of 2",
    steps: [" Add the 4²’s together, and then make it into a base of 2", "4(4²) = 2ˣ","Make the 4’s into 2²’s", "2²(2²)² =  2ˣ", "2²(2⁴) = 2ˣ", "2⁶ = 2ˣ", "x = 6"],
    minutes: 1.5,
    img_question: ""
}

]

function getDailyDate(resetHour, resetMinute){
    const now = new Date();
    const reset = new Date(now);

    reset.setHours(resetHour, resetMinute, 0, 0);

    if (now < reset){
        reset.setDate(reset.getDate()-1);

    }

    return reset;
}

const startDate = new Date("2026-01-05T00:00:00");
const dailyDate = getDailyDate(0, 0);
const dailyIndex = Math.floor((dailyDate - startDate) / 86400000) % questions.length;
const dayKey = dailyDate.toISOString().split("T")[0];
const q = questions[dailyIndex];
const buttons = document.querySelectorAll('.option button');
const explanation = document.querySelector(".answer-explanation");
const hintButton = document.getElementById("hint");
const timer = document.getElementById("timer");
const hintExplanation = document.querySelector(".hint-explanation");
document.getElementById('hint-explanation').innerText = q.hint;
document.getElementById('A').innerText = q.answer.A;
document.getElementById('B').innerText = q.answer.B;
document.getElementById('C').innerText = q.answer.C;
document.getElementById('D').innerText = q.answer.D;

document.getElementById('question').innerText = q.question;
let hintsUsed = false;
let points = 0;
let timeUp = false;
let timeInterval = null;
let paused = false;
let time = q.minutes * 60;
let hintClicked = false;
const img = document.getElementById("img_question");
const imgWrapper = document.querySelector(".img_question");

if (q.img_question){
    img.src = q.img_question;
    imgWrapper.style.display = "block";
}
else{
    img.removeAttribute("src");
    imgWrapper.style.display = "none";
}
const correctAnswer = q.correct;

auth.onAuthStateChanged(async user => {
  if (!user) {
    window.location.href = "../../login.html";
    return;
  }
  


const userRef = db.collection("users").doc(user.uid);
const userDoc = await userRef.get();
if (!userDoc.exists){
    await userRef.set({
        email: user.email,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
}
const dayRef = db.collection("users").doc(user.uid).collection("medium").doc(dayKey);
const dayDoc = await dayRef.get();

if (dayDoc.exists){
    const data = dayDoc.data();
    time = data.remainingTime ?? q.minutes * 60;
    paused = data.paused ?? false;
    updateCountdown();
    if (!paused) startTimer();
    loadUserData(user.uid);
}
else
{
    time = q.minutes * 60;
    paused = false;
    await dayRef.set({remainingTime: time, paused: false, hintsUsed: false, points: 0});
    updateCountdown(0);
    startTimer(0);

}
});
    








async function loadUserData(uid){
    const doc = await db
    .collection("users")
    .doc(uid)
    .collection("medium")
    .doc(dayKey)
    .get();

    if (doc.exists){
        const data = doc.data();
        hintsUsed = data.hintsUsed;
        points = data.points || 0;

        if (data.answer){
            reload(data.answer);
        }

    }
}

function updateHintButton(){
    if(hintsUsed){
        hintButton.disabled = true;
        hintExplanation.classList.add("disabled-after-answer");

        hintButton.style.backgroundColor = "rgb(178, 190, 181, 0.5)";
        hintButton.style.boxShadow = "0 0 30px rgb(75, 75, 75, 0.5)";
        hintButton.style.borderColor = "grey";

    if (hintClicked){
        hintExplanation.classList.add("visible");
        hintExplanation.style.height = hintExplanation.scrollHeight + "px";
        hintExplanation.style.opacity = "1";
        hintExplanation.style.transform = "translateY(0)"
    }
        
        

    
    else{
        hintExplanation.classList.remove("visible")
        hintExplanation.style.height = "0px";
        hintExplanation.style.opacity = "0";
        hintExplanation.style.transform = "translateY(-10px)";

    }
}
    else{
    hintButton.disabled = false;
    hintButton.classList.remove("disabled-after-answer");

    hintButton.style.backgroundColor = "#f7f7f7";
    hintButton.style.boxShadow = "0 0 40px grey";
    hintButton.style.borderColor = "rgb(255,166,56)";

    hintExplanation.classList.remove("visible");
    hintExplanation.style.height = "0px";
    hintExplanation.style.opacity = "0";
    hintExplanation.style.transform = "translateY(-10px)"
    }
}
hintButton.addEventListener("click", async () => {
    if (hintsUsed) return;
    hintsUsed = true;
    hintClicked = true;
    updateHintButton();

    const user = auth.currentUser;
    if (user){
        await db.collection("users").doc(user.uid).collection("medium").doc(dayKey).set({hintsUsed: true, points: points}, {merge:true});
    }
});

function showAnswerExplanation(){
    explanation.innerHTML = "";
    q.steps.forEach((step, index) => {
        const stepDiv = document.createElement("p");
        stepDiv.classList.add("step");
        stepDiv.innerHTML = `<strong>Step ${index +1}:</strong><br><br>${step}`;
        explanation.appendChild(stepDiv);
    });
    explanation.classList.add("visible")

}
function reload(choice){
    if (timeInterval){
        clearInterval(timeInterval);
        timeInterval = null;
        timer.style.color = "black";
    }
    hintsUsed = true;
    hintClicked = hintClicked || false;
    updateHintButton();
    buttons.forEach(button => {
        button.disabled = true;
        button.parentElement.classList.add("disabled");

        
    

        if (button.id === correctAnswer){
            button.style.backgroundColor = "rgb(48, 133, 24, 0.5)";
            button.style.boxShadow = "0 0 30px rgb(75, 75, 75, 0.5)";

        }
        else if (button.id === choice){
            button.style.backgroundColor = "rgb(135, 24, 24, 0.5)";
            button.style.boxShadow = "0 0 30px rgb(135, 24, 24, 0.5)";


        }
        else
        {
            button.style.backgroundColor = "rgb(178, 190, 181, 0.5)";
            button.style.boxShadow = "0 0 30px rgb(75, 75, 75, 0.5)";
        }

    });
    showAnswerExplanation();
}


const startingMinutes = q.minutes;



const answer = document.querySelector(".hint-explanation");








buttons.forEach(button => {
    button.addEventListener( "click", async () => {
        let starsEarned = 0;
        paused = true;
        if (timeInterval){
            clearInterval(timeInterval);
        }
        if (button.id === correctAnswer){
            starsEarned = 1;
                if (!timeUp){
                starsEarned++;
            }

            if (!hintsUsed){
                starsEarned++;
            }
        }
        paused = true;
        if (timeInterval) clearInterval (timeInterval);
    
        const user = auth.currentUser;
        if (user){
            await db.collection("users").doc(user.uid).collection("medium").doc(dayKey).set({
                answer: button.id,
                stars: starsEarned,
                hintsUsed: hintsUsed,
                paused: true,
                remainingTime: time


            }, {merge:true});
        }
        reload(button.id);
    });
});

window.addEventListener("focus", () => {
    if(!timeUp && !paused) startTimer();
});

function startTimer(){
    if (!timeInterval){
    timeInterval = setInterval(async ()=>{
        updateCountdown();

        const user = auth.currentUser;
        if(user){
            await db.collection("users").doc(user.uid).collection("medium").doc(dayKey).set({
                remainingTime: time, paused: paused,}, {merge:true});
            
            }
        }, 1000);
        }
    }
    


function updateCountdown(){
    if (time<=0){
        timer.innerHTML = "⏱️0:00";
        timer.style.color = "#EB5E5E";
        timeUp = true;
        clearInterval(timeInterval);
        timeInterval = null;
        return;
    }
    const minutes = Math.floor(time/60);
    const seconds = time % 60;
    timer.innerHTML = `⏱️${minutes}:${seconds.toString().padStart(2, "0")}`;
    time--



}

window.addEventListener("load", () => {
    startTimer();
})




</script>
