function showModal({
    title,
    message,
    confirmText = "Continue",
    cancelText = "Cancel",
    danger = false,
    password = false,
    error = false,
    success = false,
    showCancel = true
}) {
    const overlay = document.getElementById("custom-modal");
    const titleEl = document.getElementById("modal-title");
    const messageEl = document.getElementById("modal-message");
    const confirmBtn = document.getElementById("modal-confirm");
    const cancelBtn = document.getElementById("modal-cancel");
    const icon = document.getElementById("modal-icon");
    const passwordInput = document.getElementById("modal-password");

    titleEl.textContent = title;
    messageEl.textContent = message;
    confirmBtn.textContent = confirmText;
    cancelBtn.textContent = cancelText;

    cancelBtn.hidden = !showCancel;
    passwordInput.hidden = !password;
    passwordInput.value = "";
    passwordInput.required = password;

    if (error || danger) {
        confirmBtn.style.background =
            "linear-gradient(135deg, #f16c77, #dc4757)";
        icon.innerHTML = "<span>!</span>";
    } else if (success) {
        confirmBtn.style.background =
            "linear-gradient(135deg, #16a878, #0d9668)";
        icon.innerHTML = "<span>✓</span>";
    } else {
        confirmBtn.style.background =
            "linear-gradient(135deg, #3985f7, #655ce6)";
        icon.innerHTML = "<span>i</span>";
    }

    overlay.hidden = false;

    if (password) {
        passwordInput.focus();
    } else {
        confirmBtn.focus();
    }

    return new Promise(resolve => {
        let finished = false;

        function finish(result) {
            if (finished) return;
            finished = true;

            overlay.hidden = true;
            passwordInput.value = "";

            confirmBtn.removeEventListener("click", onConfirm);
            cancelBtn.removeEventListener("click", onCancel);
            overlay.removeEventListener("click", onBackdrop);
            document.removeEventListener("keydown", onKeydown);

            resolve(result);
        }

        function onConfirm() {
            if (password && !passwordInput.value.trim()) {
                passwordInput.focus();
                return;
            }

            finish(password ? passwordInput.value : true);
        }

        function onCancel() {
            finish(false);
        }

        function onBackdrop(event) {
            if (event.target === overlay && showCancel) {
                finish(false);
            }
        }

        function onKeydown(event) {
            if (event.key === "Escape" && showCancel) {
                finish(false);
            }

            if (event.key === "Enter" && !overlay.hidden) {
                event.preventDefault();
                onConfirm();
            }
        }

        confirmBtn.addEventListener("click", onConfirm);

        if (showCancel) {
            cancelBtn.addEventListener("click", onCancel);
        }

        overlay.addEventListener("click", onBackdrop);
        document.addEventListener("keydown", onKeydown);
    });
}

    if (!user.email){
        alert("Please contact support to delete your account");
        return;
    }

  const password = await showModal({
    title: "Confirm your identity",
    message: "Enter your password to securely delete your account.",
    confirmText: "Verify & delete",
    cancelText: "Cancel",
    danger: true,
    password: true
});

if (password === false) return;
    try {
        const credential =
            firebase.auth.EmailAuthProvider.credential(
                user.email,
                password
            );

        await user.reauthenticateWithCredential(credential);

        const uid = user.uid;

        const collections = [
            "easy", "medium", "hard",
            "AMC_8", "AMC_10", "AMC_12",
            "Limits", "Derivatives", "Integrals",
            "easy_logic"
        ];

        for (const name of collections) {
            const ref = firebase.firestore()
                .collection("users")
                .doc(uid)
                .collection(name);

            while (true) {
                const snapshot = await ref.limit(400).get();

                if (snapshot.empty) break;

                const batch = firebase.firestore().batch();

                snapshot.docs.forEach(doc => {
                    batch.delete(doc.ref);
                });

                await batch.commit();
            }
        }

        await firebase.firestore()
            .collection("users")
            .doc(uid)
            .delete();

        await user.delete();

     
await showModal({
    title: "Account deleted",
    message: "Your Mathemagic account has been successfully deleted. We're sorry to see you go!",
    confirmText: "Return home",
    success: true,
    showCancel: false
});

window.location.replace("/");


    } catch (error) {
    console.error("Account deletion failed:", error);

    let title = "Something went wrong";
    let message =
        "We couldn't delete your account. Please try again.";

    if (
        error.code === "auth/wrong-password" ||
        error.code === "auth/invalid-credential"
    ) {
        title = "Incorrect password";
        message =
            "That password doesn't match your account. Please check it and try again.";
    } else if (error.code === "auth/too-many-requests") {
        title = "Too many attempts";
        message =
            "For your security, please wait a little before trying again.";
    } else if (
        error.code === "auth/requires-recent-login"
    ) {
        title = "Please sign in again";
        message =
            "Your session has expired. Sign in again before deleting your account.";
    } else if (
        error.code === "permission-denied" ||
        error.code === "firestore/permission-denied"
    ) {
        title = "Permission denied";
        message =
            "We couldn't access all the data needed to complete this request. Please try again later.";
    }

    await showModal({
        title,
        message,
        confirmText: "Got it",
        error: true,
        showCancel: false
    });
    }});


</script>
