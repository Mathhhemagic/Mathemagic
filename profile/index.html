<script>

  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();


  function getTodayKey(){
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function getYesterdayKey(){
    const d = new Date();
    d.setDate(d.getDate() - 1);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function submitAnswer(diff, starsEarned){
    if(starsEarned < 1 || starsEarned > 3) return;

    const user = firebase.auth().currentUser;
    if(!user) return;

    const uid = user.uid;
    const todayKey = getTodayKey();

    db.collection("users").doc(uid).collection(diff).doc(todayKey).set({
        stars: starsEarned}, {merge:true}
    ).then (async () => {
        console.log(`${starsEarned} stars added for ${diff}`);
        await updateDailyStreak();
        await updateProfileUI();
    })
    .catch(err => console.error(err));
  }
async function updateDailyStreak(){
    const user = firebase.auth().currentUser;
    if (!user) return;

    const uid = user.uid;
    const userRef = db.collection("users").doc(uid);

    const todayKey = getTodayKey();
    const yesterdayKey = getYesterdayKey();
    try{
        const userDoc = await userRef.get();
        let streak = 0;
        let lastActive = null;

        if (userDoc.exists){
            const data = userDoc.data();
            streak = data.dailyStreak ?? 0;
            lastActive = data.lastActive ?? null;

        }
        if(lastActive === todayKey){

        }

        else if (lastActive === yesterdayKey){
            streak += 1;
        }

        else{
            streak = 1;
        }
        
            await userRef.set({
                dailyStreak: streak,
                lastActive: todayKey},
                {merge : true});

            document.getElementById("profile-streak").textContent = streak + (streak === 1 ? " day" : " days");
        }
        catch (err){
            console.error("Error updating daily streak: ", err);
            document.getElementById("profile-streak").textContent = "0 days";
        }
}
  async function updateProfileUI(){
    const user = firebase.auth().currentUser;
    if(!user) return;
    const uid = user.uid;

    const difficulties = ["easy", "medium", "hard"];

    let totalStars = 0;
    let totalDone = {easy: 0, medium: 0, hard: 0};

    for (let diff of difficulties){
        try{
            const snapshot = await db.collection("users").doc(uid).collection(diff).get();
            snapshot.forEach(doc => {
                const data = doc.data();
                const stars = data.stars ?? 0;
                totalStars += stars;
                if (stars >= 1){
                    totalDone[diff] += 1;
                }
             
            });
        } catch(err){
            console.error(`Error fetching ${diff} questions:`, err);
        }
    }
    

    document.getElementById("profile-easy-done").textContent = totalDone.easy;
    document.getElementById("profile-medium-done").textContent = totalDone.medium;
    document.getElementById("profile-hard-done").textContent = totalDone.hard;
    document.getElementById("profile-stars").textContent = totalStars +  "★";
}

  



        
  firebase.auth().onAuthStateChanged(async (user) =>{
if (!user){
    window.location.href = "/login/";
    return;
}

const uid = user.uid;
    const colors = ["#ffb5b0", "#ffd6b0", "#f8ffb0", "#ccffb0", "#b0ffd8", "#b0ffd8", "#b0f8ff", "#b0deff", "#b0deff", "#bbb0ff", "#c5b0ff", "#e6b0ff", "#f5b8ec", "#eba9b7"]
    const icon = document.getElementById("user-icon");
    const dropdown = icon.nextElementSibling;
    icon.textContent = user.displayName ? user.displayName[0].toUpperCase(): "U";
    let hash = 0;
    const str = user.uid || user.email;
    for (let i=0; i<str.length; i++) hash += str.charCodeAt(i);
    const colorIndex = hash % colors.length;
    icon.style.backgroundColor = colors[colorIndex];
    dropdown.innerHTML = 
    `<a href = "/profile/">Profile</a>
    <a href = "/login/" id = "logout">Logout</a>`;
     const logout = document.getElementById("logout");
    logout.addEventListener("click", async (e) => {
        e.preventDefault();
        try{
            await firebase.auth().signOut();
            window.location.href = "/login/";
        }
        catch(error){
            console.error("Logout error:", error);
            alert("Failed to logout: " + error.message);
        }
    })

    document.getElementById("profile-email").textContent = user.email || "-";
    document.getElementById("profile-username").textContent = user.displayName || "-";
    await updateDailyStreak();
    await updateProfileUI();
    
});
