function evaluateLatex(latex, scope = {}){
latex = latex.replace(/\\left|\\right/g, "").replace(/\\ /g, "").replace(/\s+/g, "");


latex = latex.replace(/\\cdot/g, "*").replace(/\\times/g, "*").replace(/\\div/g, "/").replace(/\\pi/g, "pi");

latex = latex.replace(/(\d+)\\frac\{([^{}]*)\}\{([^{}]*)\}/g, "($1+($2)/($3))");

latex = latex.replace(/\\sqrt\{([^{}]*)\}/g, "sqrt($1)");

latex = latex.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, "(($1)/($2))");

latex = latex.replace(/\^/g, "^");

latex = latex.replace(/(\d)([a-zA-Z])/g, "$1*$2");

latex = latex.replace(/(\d)\(/g, "$1*(");

latex = latex.replace(/([a-zA-Z])\(/g, "$1*(");


latex = latex.replace(/\)\(([a-zA-Z])/g, ")*$1");

latex = latex.replace(/([a-zA-Z])([a-zA-Z])/g, "$1*$2");


return math.evaluate(latex,scope);
}


function evaluateLatexExpression(latex){
    latex = latex.replace(/\\left|\\right/g, "").replace(/\\ /g, "").replace(/\s+/g, "");
    latex = latex.replace(/\\cdot/g, "*").replace(/\\times/g, "*").replace(/\\div/g, "/").replace(/\\pi/g, "pi");

latex = latex.replace(/(\d+)\\frac\{([^{}]*)\}\{([^{}]*)\}/g, "($1+($2)/($3))");

latex = latex.replace(/\\sqrt\{([^{}]*)\}/g, "sqrt($1)");

latex = latex.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, "(($1)/($2))");


latex = latex.replace(/(\d)([a-zA-Z])/g, "$1*$2");

latex = latex.replace(/(\d)\(/g, "$1*(");

latex = latex.replace(/([a-zA-Z])\(/g, "$1*(");

latex = latex.replace(/\)\(/g, ")*(");

return math.parse(latex)
}

function checkInequality(userAnswer, correctAnswer){
    userAnswer = userAnswer.replace(/\\geq|\\ge/g, ">=").replace(/\\leq|\\le/g, "<=").replace(/\\gt/g, ">").replace(/\\lt/g, "<").replace(/\s+/g, "").replace(/−/g, "-");

    correctAnswer = correctAnswer.replace(/\\geq|\\ge/g, ">=").replace(/\\leq|\\le/g, "<=").replace(/\\gt/g, ">").replace(/\s+/g, "").replace(/\\lt/g, "<").replace(/−/g, "-");
    return userAnswer === correctAnswer;
}

function checkCoordinate(userAnswer, correctAnswer){
    userAnswer = userAnswer.replace(/\\left|\\right/g, "").replace(/\\ /g, "").replace(/\s+/g, "").replace(/[{}]/g, "");
correctAnswer = correctAnswer.replace(/\\left|\\right/g, "").replace(/\\ /g, "").replace(/\s+/g, "").replace(/[{}]/g, "");
  
const userMatch = userAnswer.match(/\((.*?),(.*?)\)/);
const correctMatch = correctAnswer.match(/\((.*?),(.*?)\)/);

if (!userMatch || !correctMatch) return false;

return math.evaluate(userMatch[1]) === math.evaluate(correctMatch[1]) &&
math.evaluate(userMatch[2]) === math.evaluate(correctMatch[2]);

}
function handleAnswer(){
  if (awaitingNext){
    nextQuestion();
    submitButton.innerText = "Check";
    submitButton.style.borderColor = "rgb(2, 126, 0)";
    submitButton.classList.remove("next");

    awaitingNext = false;
    submitted = false;
    return;


  }
   if (submitted) return;

    
    const q = questions[currentIndex];
    const userAnswer = answerInput.latex();
    


    if (userAnswer === ""){
        err.innerText = "Please enter an answer!"
        err.style.fontFamily = "'Libertinus Math', system-ui";
                return;
    }

    if (q.type === "arithmetic"){
        let checkLetters = userAnswer.replace(/\\frac/g, "").replace(/\\pi/g, "").replace(/\\sqrt/g, "").replace(/[{}]/g, "").replace(/\\cdot/g, "").replace(/\\times/g, "").replace(/\\div/g, "")

        if(/[a-zA-Z]/.test(checkLetters)){
            err.innerText = "Letters are not allowed in this lesson";
            return;
        }
    }

    answerInput.el().style.pointerEvents = "auto";
    let userValue;
    let correctValue;



    if (q.correct.includes(":")){
        const normalize = str => str.replace(/\s+/g, "").replace(/\{/g,"").replace(/\}/g, "");

        if (normalize(userAnswer) === normalize(q.correct)){
            userValue = 1;
            correctValue = 1;
        }
        else{
            userValue= 0;
            correctValue = 1;
        }
    }
    else{
    
    try{
        if (q.correct.includes(",")){
            if(checkCoordinate(userAnswer, q.correct)){
                userValue = 1;
                correctValue = 1;
            }
            else{
                userValue = 0;
                correctValue = 1;
            }
        }
        else if (q.type === "inequality"){
            if (checkInequality(userAnswer, q.correct)){
                userValue = 1;
                correctValue = 1;
            }

            else{
                userValue = 0;
                correctValue = 1;
            }
        }


        else if (q.type === "algebra"){
          const userExpression = evaluateLatexExpression(userAnswer);
          const correctExpression = evaluateLatexExpression(q.correct);

          const difference = math.simplify(`(${userExpression.toString()}) - (${correctExpression.toString()})`
          );
          if (difference.toString() === "0"){
            userValue = 1;
            correctValue = 1;
          }
        else{
           userValue = 0;
           correctValue = 1;
        }
    }
    else{
        userValue = evaluateLatex(userAnswer);
        correctValue = evaluateLatex(q.correct);
    }
    
    }
    catch{
        err.innerText = "Invalid math expression";
        return;
    
    }
    }


    if(Math.abs(userValue - correctValue) < 1e-10){
        answerDiv.classList.add("correct");
        setTimeout(() => answerDiv.classList.remove("correct"), 400);
        points += 10;
        correctAnswers++;

        const battery = document.querySelector(".battery");
battery.classList.add("pop");
setTimeout(() => battery.classList.remove("pop"), 300);
        const fill = document.getElementById("battery-fill")
        fill.classList.add("grow");
        setTimeout(() => fill.classList.remove("grow"), 500);
        const maxXP = questions.length * 10;
        const percent = (points /maxXP) * 100
        fill.style.width = percent + "%";
        document.getElementById("battery-text").innerText = Math.round(percent) + "%"

        document.getElementById("battery-fill").style.width = percent + "%";

        
        if (percent < 40){
            fill.style.background = "linear-gradient(90deg, #36b5ff, #6fd6ff)";
        }
        else if (percent < 70){
         fill.style.background = "linear-gradient(90deg, #6fff8b, #b4ffcc)";
        }
        else if (percent < 100){
        fill.style.background = "linear-gradient(90deg, #ffd86f, #ffb347)";
        }
        else{
            fill.style.background = "linear-gradient(90deg, #ff9a3c, #ff5e00)";
        }
      
        
        answerDiv.style.borderColor = "rgb(48, 133, 24, 0.3)";
    }
    else{
        answerDiv.classList.add("wrong");
        setTimeout(() => answerDiv.classList.remove("wrong"), 400);
        wrongAnswers++;
        answerDiv.style.borderColor = "rgb(135, 24, 24, 0.3)";
        const correct = document.createElement("p");
        correct.innerText = `Correct answer: ${q.correct}`;
        correct.style.color = "green";
        steps.appendChild(correct);
    }
    submitted = true;
    answerInput.blur();
    answerInput.el().classList.add("mq-disabled");
    answerInput.el().style.pointerEvents = "none";
    answerDiv.style.backgroundColor = "rgba(200,200,200,0.3)";
    showSteps(q);
    hintButton.disabled = true;

  
    submitButton.innerText = "Next";
    submitButton.style.borderColor = "rgb(110, 136, 207)";
    submitButton.classList.add("next");
    awaitingNext = true;

};

 document.querySelector(".all-cards").style.display = "flex";
  document.querySelector(".mascot img").style.display = "flex";

    document.getElementById("accuracy-value").innerText = accuracy + "%";
  const user = auth.currentUser;
    if(user){
        const userRef = db.collection("users").doc(user.uid);
        userRef.get().then((doc) => {
            let oldXP = 0;
            let oldAccuracy = 0;
            let oldActivity = null;
            if(doc.exists){
                oldActivity = doc.data().world10?.[`activity_${lessonNumber}`];
            }

            if (oldActivity){
              oldXP = oldActivity.xp || 0;
              oldAccuracy = oldActivity.accuracy || 0;
            }
            
            const finalXP = Math.max(points, oldXP);
            const finalAccuracy = Math.max(accuracy, oldAccuracy);

            document.getElementById("xp-value").innerText = finalXP;
        return userRef.set({
        world10:{
           [`activity_${lessonNumber}`]: {
            accuracy: Math.max(accuracy, oldAccuracy),
            xp: Math.max(points, oldXP),
            completed: true
           }
        }}, {merge: true});
    
    });
    
    
}

function startDrag(e){
    dragging = true;

    const touch = e.touches ? e.touches[0] : e;

    const rect = calculatorWindow.getBoundingClientRect();
    offsetX = touch.clientX - rect.left;
    offsetY = touch.clientY - rect.top;

}

function moveDrag(e){

    if (!dragging) return;

    e.preventDefault();
    const touch = e.touches ? e.touches[0] : e;
calculatorWindow.style.left = (touch.clientX - offsetX) + "px";
    calculatorWindow.style.top = (touch.clientY - offsetY) + "px";
}

function stopDrag(){
    dragging = false;
}

header.addEventListener("mousedown", startDrag);
document.addEventListener("mousemove", moveDrag);
document.addEventListener("mouseup", stopDrag);

header.addEventListener("touchstart", startDrag, {passive:false});
document.addEventListener("touchmove", moveDrag, {passive:false});
document.addEventListener("touchend", stopDrag);
