function getDailyDate(resetHour, resetMinute){
    const now = new Date();
    const reset = new Date(now);

    reset.setHours(resetHour, resetMinute, 0, 0);

    if (now < reset){
        reset.setDate(reset.getDate()-1);

    }

    return reset;
}

async function loadUserData(uid){
    const doc = await db
    .collection("users")
    .doc(uid)
    .collection("easy")
    .doc(dayKey)
    .get();

    if (doc.exists){
        const data = doc.data();
        hintsUsed = data.hintsUsed;
        hintClicked = data.hintClicked || false;
        points = data.points || 0;

        if (data.answer){
            reload(data.answer);
        }

    }
    updateHintButton();
}

        hintButton.style.borderColor = "grey";

    if (hintClicked){
        hintExplanation.classList.add("visible");
        hintExplanation.style.height = hintExplanation.scrollHeight + "px";
        hintExplanation.style.opacity = "1";
        hintExplanation.style.transform = "translateY(0)"
    }
        
        

    
    else{
        hintExplanation.classList.remove("visible")
        hintExplanation.style.height = "0px";
        hintExplanation.style.opacity = "0";
        hintExplanation.style.transform = "translateY(-10px)";

    }
}
    else{
    hintButton.disabled = false;
    hintButton.classList.remove("disabled-after-answer");

    hintButton.style.backgroundColor = "#f7f7f7";
    hintButton.style.boxShadow = "0 0 40px grey";
    hintButton.style.borderColor = "rgb(255,166,56)";

    hintExplanation.classList.remove("visible");
    hintExplanation.style.height = "0px";
    hintExplanation.style.opacity = "0";
    hintExplanation.style.transform = "translateY(-10px)"
    }
}
hintButton.addEventListener("click", async () => {
    if (hintsUsed) return;
    hintsUsed = true;
    hintClicked = true;
    updateHintButton();

    const user = auth.currentUser;
    if (user){
        await db.collection("users").doc(user.uid).collection("easy").doc(dayKey).set({hintsUsed: true,hintClicked: true, points: points}, {merge:true});
    }
});

function showAnswerExplanation(){
    explanation.innerHTML = "";
    q.steps.forEach((step, index) => {
        const stepDiv = document.createElement("p");
        stepDiv.classList.add("step");
        stepDiv.innerHTML = `<strong>Step ${index +1}:</strong><br><br>${step}`;
        explanation.appendChild(stepDiv);
    });
    explanation.classList.add("visible")

}
function reload(choice){
    if (timeInterval){
        clearInterval(timeInterval);
        timeInterval = null;
        timer.style.color = "black";
    }
    hintsUsed = true;
    hintClicked = hintClicked || false;
    updateHintButton();
    buttons.forEach(button => {
        button.disabled = true;
        button.parentElement.classList.add("disabled");

        
    

        if (button.id === correctAnswer){
            button.style.backgroundColor = "rgb(48, 133, 24, 0.5)";
            button.style.boxShadow = "0 0 30px rgb(75, 75, 75, 0.5)";

        }
        else if (button.id === choice){
            button.style.backgroundColor = "rgb(135, 24, 24, 0.5)";
            button.style.boxShadow = "0 0 30px rgb(135, 24, 24, 0.5)";


        }
        else
        {
            button.style.backgroundColor = "rgb(178, 190, 181, 0.5)";
            button.style.boxShadow = "0 0 30px rgb(75, 75, 75, 0.5)";
        }

    });
    showAnswerExplanation();
}


const startingMinutes = q.minutes;



const answer = document.querySelector(".hint-explanation");








buttons.forEach(button => {
    button.addEventListener( "click", async () => {
        let starsEarned = 0;
        paused = true;
        if (timeInterval){
            clearInterval(timeInterval);
        }
        if (button.id === correctAnswer){
            starsEarned = 1;
                if (!timeUp){
                starsEarned++;
            }

            if (!hintsUsed){
                starsEarned++;
            }
        }
       
        reload(button.id)
    
        const user = auth.currentUser;
        if (user){
            await db.collection("users").doc(user.uid).collection("easy").doc(dayKey).set({
                answer: button.id,
                stars: starsEarned,
                hintsUsed: hintsUsed,
                hintClicked: hintClicked,
                paused: true,
                remainingTime: time


            }, {merge:true});
        }
        reload(button.id);
    });
});

window.addEventListener("focus", () => {
    if(!timeUp && !paused) startTimer();
});

function startTimer(){
    if (!timeInterval){
    timeInterval = setInterval(async ()=>{
        updateCountdown();

        const user = auth.currentUser;
        if(user){
            await db.collection("users").doc(user.uid).collection("easy").doc(dayKey).set({
                remainingTime: time, paused: paused,}, {merge:true});
            
            }
        }, 1000);
        }
    }
    


function updateCountdown(){
    if (time<=0){
        timer.innerHTML = "⏱️0:00";
        timer.style.color = "#EB5E5E";
        timeUp = true;
        
        clearInterval(timeInterval);
        timeInterval = null;

    
        return;
    }
    const minutes = Math.floor(time/60);
    const seconds = time % 60;
    timer.innerHTML = `⏱️${minutes}:${seconds.toString().padStart(2, "0")}`;
    time--



}

window.addEventListener("load", () => {
    startTimer();
})
