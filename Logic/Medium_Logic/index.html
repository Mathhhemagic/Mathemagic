function getDailyDate(resetHour, resetMinute){
    const now = new Date();
    const reset = new Date(now);

    reset.setHours(resetHour, resetMinute, 0, 0);

    if (now < reset){
        reset.setDate(reset.getDate()-1);

    }

    return reset;
}

function getLocalDayKey(date = new Date()){
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}

async function awardXP(uid) {
    const userRef = db.collection("users").doc(uid);

    const dayRef = userRef.collection("medium_logic").doc(dayKey);

    const today = getLocalDayKey();

    const yesterdayDate = new Date();

    yesterdayDate.setDate(yesterdayDate.getDate() - 1);
    const yesterday = getLocalDayKey(yesterdayDate);

    await db.runTransaction(async transaction => {
        const userSnap = await transaction.get(userRef);
        const daySnap = await transaction.get(dayRef);

        const userData = userSnap.exists ? userSnap.data() : {};

        const dayData = daySnap.exists ? daySnap.data() : {};

        if (dayData.xpAwarded) return;

        const lastActiveDate = userData.lastActiveDate || null;
        let streak = userData.dailyStreak || 0;

        if (lastActiveDate !== today){
            streak = lastActiveDate === yesterday ? streak + 1 : 1;
        }
           transaction.set(userRef, {
            globalXP: (Number(userData.globalXP) || 0) + 2,
            dailyXP: (lastActiveDate === today ? (Number(userData.dailyXP) || 0) + 2 : 2),
            dailyStreak: streak,
            lastActiveDate: today
        }, {merge: true});

        transaction.set(dayRef, {
            xpAwarded: true},
            {merge: true});
        });
    }

                if (!timeUp){
                starsEarned++;
            }

            if (!hintsUsed){
                starsEarned++;
            }
        }
       
        reload(button.id)
    
        const user = auth.currentUser;
        if (user){

            const dayRef = db.collection("users").doc(user.uid).collection("medium_logic").doc(dayKey);
            await db.collection("users").doc(user.uid).collection("medium_logic").doc(dayKey).set({
                answer: button.id,
                stars: starsEarned,
                hintsUsed: hintsUsed,
                hintClicked: hintClicked,
                paused: true,
                remainingTime: time


            }, {merge:true});

            if (button.id === correctAnswer){
                await awardXP(user.uid);
            }
        }
        reload(button.id);
    });
});

window.addEventListener("focus", () => {
    if(!timeUp && !paused) startTimer();
});

function startTimer(){
    if (!timeInterval){
    timeInterval = setInterval(async ()=>{
        updateCountdown();

        const user = auth.currentUser;
        if(user){
            await db.collection("users").doc(user.uid).collection("medium_logic").doc(dayKey).set({
                remainingTime: time, paused: paused,}, {merge:true});
            
            }
        }, 1000);
        }
    }
    


function updateCountdown(){
    if (time<=0){
        timer.innerHTML = "⏱️0:00";
        timer.style.color = "#EB5E5E";
        timeUp = true;
        
        clearInterval(timeInterval);
        timeInterval = null;

    
        return;
    }
    const minutes = Math.floor(time/60);
    const seconds = time % 60;
    timer.innerHTML = `⏱️${minutes}:${seconds.toString().padStart(2, "0")}`;
    time--



}

window.addEventListener("load", () => {
    startTimer();
})
