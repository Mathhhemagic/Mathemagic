<script>

const firebaseConfig = {

  apiKey: "AIzaSyDRjjvLABEFL-PgbChUFNZW6u38U6c7jP4",

  authDomain: "mathemagic-fcb1d.firebaseapp.com",

  projectId: "mathemagic-fcb1d",

  storageBucket: "mathemagic-fcb1d.firebasestorage.app",

  messagingSenderId: "313453456371",

  appId: "1:313453456371:web:21e60d301936c2333f8086"

};


firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();


firebase.auth().onAuthStateChanged(async user => {
    const colors = ["#ffb5b0", "#ffd6b0", "#f8ffb0", "#ccffb0", "#b0ffd8", "#b0ffd8", "#b0f8ff", "#b0deff", "#b0deff", "#bbb0ff", "#c5b0ff", "#e6b0ff", "#f5b8ec", "#eba9b7"]
    const icon = document.getElementById("user-icon");
    const dropdown = icon.nextElementSibling;
    if (user){
    const uid = user.uid
    icon.textContent = user.displayName ? user.displayName[0].toUpperCase(): "U";
    let hash = 0;
    const str = user.uid || user.email;
    for (let i=0; i<str.length; i++) hash += str.charCodeAt(i);
    const colorIndex = hash % colors.length;
    icon.style.backgroundColor = colors[colorIndex];
    dropdown.innerHTML = 
    `<a href = "/profile/">Profile</a>
    <a href = "/login/" id = "logout">Logout</a>`;
     const logout = document.getElementById("logout");
    logout.addEventListener("click", async (e) => {
        e.preventDefault();
        try{
            await firebase.auth().signOut();
            window.location.href = "/login/";
        }
        catch(error){
            console.error("Logout error:", error);
            alert("Failed to logout: " + error.message);
        }
    })
    function getDailyDate(resetHour, resetMinute){
    const now = new Date();
    const reset = new Date(now);
    reset.setHours(resetHour, resetMinute, 0, 0)

    if (now < reset){
        reset.setDate(reset.getDate()-1);
    }
    return reset;
}


    const todayKey = getDailyDate(0,0).toISOString().split("T")[0];

    const difficulties = ["Easy_Logic", "AMC_10", "AMC_12"];

    for (let diff of difficulties){
        try{
        const docRef = firebase.firestore().collection("users").doc(uid).collection(diff).doc(todayKey);
        const docSnap = await docRef.get();
        let stars = 0;
        if (docSnap.exists){
            const data = docSnap.data();
            stars = data.stars ?? 0;
        }
        const starText = "★".repeat(stars) +"☆".repeat(3 - stars);
        document.getElementById(diff + "_stars").textContent = starText;
    }
    catch(err){
        console.error(`Error loading ${diff} stars:`, err);
        document.getElementById(diff + "_stars").textContent = "☆ ☆ ☆";
    }
    
}
    }
    else{
        icon.textContent = "";
        icon.style.backgroundColor = "gray";
        dropdown.innerHTML = 
        `<a href = "/login/">Login</a>
        <a href = "/signup/">Signup</a>
        `
    }
    
    });

</script>
