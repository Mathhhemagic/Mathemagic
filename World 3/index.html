html, body{

.press{
    background: rgb(0, 136, 136);
    color: white;
    border: none;
    padding: 16px 30px;
    font-size: 30px; 
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 6px 0 rgb(0, 85, 85);
    font-family: "Zilla Slab", serif;
    transition: all 0.1s ease;
    max-width: 100px;
}

.press:hover{
    filter:brightness(1.2);
}

.press:active{
    transform:translateY(5px);
    box-shadow: 0 0 0 rgb(0, 85, 85);
}

.inactive{
    background: rgb(174, 174, 174);
    color: white;
    border: none;
    padding: 16px 30px;
    font-size: 30px; 
    font-weight: bold;
    border-radius: 50px;

    max-width: 100px;
}

.container{
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
    width: 250px;
    margin: auto;
}

.row{
    width: 100%;
    display: flex;
}

.left{
    justify-content: flex-start;
}

.right{
    justify-content: flex-end;
}

.full{
    display: flex;
    flex-direction: column;
    align-items: center;
}
.center{
    justify-content: center;
}
.stars{
    font-size: 30px;
    margin-top: 10px;
    color:rgb(0, 85, 85);
}

.stars span{
    display: inline-block;
    transition: transform 0.3s ease, color 0.3s ease;
}

.stars span.filled{
    color: gold;
    transform: scale(1.3);
}

.stars span.pop{
    animation: pop 0.3s ease;
}

@keyframes pop{
    0%{transform: scale(0.5);}
    50%{transform: scale(1.5);}
    100%{transform: scale(1.3);}

}

svg {
    width:32px;
    height:32px;
    fill: none;
    stroke: white;
    stroke-width: 2;
    transform: translateY(5px);
}

    const data = doc.data();
    const accuracies = []
    const world = data.world3 || {};
    for (let i = 1; i <= 5; i++){
        accuracies[i] = world[`activity_${i}`]?.accuracy ||0
    }

    for (let i = 1; i <=5; i++){
        updateStars(i, accuracies[i]);
    }


    for (let i = 1; i < 4; i++){

        if (accuracies[i] >= 70){
            const nextLesson = i + 1

            document.getElementById(`article${nextLesson}`).className = "press";
        document.getElementById(`lesson${i + 1}`).className = "press";

        document.getElementById(`article${nextLesson}-link`).href = `./article.html?article=${nextLesson}`;

        document.getElementById(`lesson${nextLesson}-link`).href = `./activity.html?lesson=${nextLesson}`;

    }
}
if (accuracies[4] >= 70){
    document.getElementById("lesson5").className = "press";

    document.getElementById("lesson5-link").href = "./activity.html?lesson=5"
}
});
function updateStars(lesson, accuracy){

    let stars = "☆ ☆ ☆";
    const starselement = document.querySelectorAll(`#activity${lesson}-stars span`);

    let filledCount = 0;

    if(accuracy === 100){
        filledCount = 3;
    }

    else if (accuracy >= 70){
        filledCount = 2;
    }

    else if (accuracy >= 40){
        filledCount = 1;
    }
    
    starselement.forEach(star => {
        star.textContent = "☆";
        star.classList.remove("filled", "pop");
    });

    for (let i = 0; i < filledCount; i++){
        setTimeout(() => {
            starselement[i].textContent = "★";
            starselement[i].classList.add("filled", "pop");
        }, i * 300);
    }

   
}

firebase.auth().onAuthStateChanged(async user => {
    const colors = ["#ffb5b0", "#ffd6b0", "#f8ffb0", "#ccffb0", "#b0ffd8", "#b0ffd8", "#b0f8ff", "#b0deff", "#b0deff", "#bbb0ff", "#c5b0ff", "#e6b0ff", "#f5b8ec", "#eba9b7"]
    const icon = document.getElementById("user-icon");
    const dropdown = icon.nextElementSibling;
    if (user){
    const uid = user.uid
    icon.textContent = user.displayName ? user.displayName[0].toUpperCase(): "U";
    let hash = 0;
    const str = user.uid || user.email;
    for (let i=0; i<str.length; i++) hash += str.charCodeAt(i);
    const colorIndex = hash % colors.length;
    icon.style.backgroundColor = colors[colorIndex];
    dropdown.innerHTML = 
    `<a href = "/profile/">Profile</a>
    <a href = "/login/" id = "logout">Logout</a>`;
     const logout = document.getElementById("logout");
    logout.addEventListener("click", async (e) => {
        e.preventDefault();
        try{
            await firebase.auth().signOut();
            window.location.href = "/login/";
        }
        catch(error){
            console.error("Logout error:", error);
            alert("Failed to logout: " + error.message);
        }
    })

    }
    else{
        icon.textContent = "";
        icon.style.backgroundColor = "gray";
        dropdown.innerHTML = 
        `<a href = "/login/">Login</a>
        <a href = "/signup/">Signup</a>
        `
    }
    
    });

</script>
